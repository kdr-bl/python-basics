<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dino Oyunu</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f7f7f7;
    font-family: sans-serif;
    overflow: hidden;
  }
  #game {
    position: relative;
    width: 100%;
    max-width: 800px;
    height: 250px;
    background: #fff;
    border-bottom: 2px solid #535353;
    overflow: hidden;
  }
  #dino {
    position: absolute;
    bottom: 0;
    left: 50px;
    width: 44px;
    height: 47px;
    background: #535353;
  }
  #dino.jump { animation: jump 0.6s ease-out; }
  @keyframes jump {
    0% { bottom: 0; }
    50% { bottom: 120px; }
    100% { bottom: 0; }
  }
  .cactus {
    position: absolute;
    bottom: 0;
    width: 25px;
    height: 50px;
    background: #535353;
  }
  #score {
    position: absolute;
    top: 10px;
    right: 20px;
    font-size: 20px;
    color: #535353;
    font-weight: bold;
  }
  #start {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 18px;
    color: #535353;
    text-align: center;
  }
  .ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 2px;
    background: #535353;
    background-image: repeating-linear-gradient(90deg, #535353 0 10px, transparent 10px 20px);
    animation: move 1s linear infinite;
  }
  @keyframes move {
    from { background-position: 0 0; }
    to { background-position: -20px 0; }
  }
</style>
</head>
<body>
<div id="game">
  <div id="score">0</div>
  <div id="dino"></div>
  <div class="ground"></div>
  <div id="start">Başlamak için Ekrana Dokun<br>veya Boşluk Tuşu</div>
</div>

<script>
let dino = document.getElementById('dino');
let game = document.getElementById('game');
let scoreEl = document.getElementById('score');
let startEl = document.getElementById('start');

let isJumping = false;
let isGameOver = false;
let score = 0;
let gameSpeed = 5;
let cacti = [];
let gameLoop;
let spawnLoop;

function jump() {
  if (isJumping || isGameOver) return;
  isJumping = true;
  dino.classList.add('jump');
  setTimeout(() => {
    dino.classList.remove('jump');
    isJumping = false;
  }, 600);
}

function spawnCactus() {
  let cactus = document.createElement('div');
  cactus.classList.add('cactus');
  cactus.style.left = game.offsetWidth + 'px';
  game.appendChild(cactus);
  cacti.push(cactus);
}

function update() {
  if (isGameOver) return;
  
  score += 1;
  scoreEl.textContent = score;
  
  if (score % 500 === 0) gameSpeed += 0.5;
  
  cacti.forEach((cactus, index) => {
    let cactusLeft = parseInt(cactus.style.left);
    cactus.style.left = cactusLeft - gameSpeed + 'px';
    
    let dinoRect = dino.getBoundingClientRect();
    let cactusRect = cactus.getBoundingClientRect();
    
    if (
      dinoRect.right > cactusRect.left &&
      dinoRect.left < cactusRect.right &&
      dinoRect.bottom > cactusRect.top &&
      dinoRect.top < cactusRect.bottom
    ) {
      gameOver();
    }
    
    if (cactusLeft < -50) {
      cactus.remove();
      cacti.splice(index, 1);
    }
  });
}

function gameOver() {
  isGameOver = true;
  clearInterval(gameLoop);
  clearInterval(spawnLoop);
  startEl.innerHTML = 'Oyun Bitti!<br>Skor: ' + score + '<br>Yeniden başlamak için dokun';
  startEl.style.display = 'block';
}

function startGame() {
  if (!isGameOver && score > 0) return;
  
  cacti.forEach(c => c.remove());
  cacti = [];
  score = 0;
  gameSpeed = 5;
  isGameOver = false;
  startEl.style.display = 'none';
  
  gameLoop = setInterval(update, 20);
  spawnLoop = setInterval(spawnCactus, 1500);
}

// Kontroller
document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (isGameOver) startGame();
    else jump();
  }
});

game.addEventListener('touchstart', e => {
  e.preventDefault();
  if (isGameOver) startGame();
  else jump();
});
</script>
</body>
</html>
